<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>JFK Queue Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #2c3e50;
      color: #ecf0f1;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .header {
      text-align: center;
      padding: 4px 0;
    }

    h1 {
      font-size: 1.1rem;
      color: #e74c3c;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 0.65rem;
      color: #7f8c8d;
      margin-top: 1px;
    }

    .scoreboard {
      display: flex;
      gap: 16px;
      margin: 3px 0;
      font-size: 0.8rem;
    }

    .scoreboard span { color: #95a5a6; }
    .scoreboard .value { color: #e74c3c; font-weight: bold; }
    .scoreboard .minutes { color: #f39c12; }

    #game-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      width: 100%;
      max-width: 500px;
      padding: 0 8px;
      min-height: 0;
    }

    #game-canvas {
      border: 2px solid #5d4e37;
      border-radius: 4px;
    }

    .dpad {
      display: grid;
      grid-template-areas:
        ". up ."
        "left . right"
        ". down .";
      gap: 3px;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .dpad button {
      width: 46px;
      height: 46px;
      border: 2px solid #5d4e37;
      border-radius: 8px;
      background: #34495e;
      color: #e74c3c;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }

    .dpad button:active {
      background: #5d4e37;
      border-color: #e74c3c;
    }

    #btn-up { grid-area: up; }
    #btn-down { grid-area: down; }
    #btn-left { grid-area: left; }
    #btn-right { grid-area: right; }

    .hint {
      margin: 3px 0;
      font-size: 0.65rem;
      color: #5d6d7e;
      text-align: center;
      flex-shrink: 0;
    }

    .legend {
      display: flex;
      gap: 12px;
      font-size: 0.6rem;
      color: #7f8c8d;
      margin: 2px 0;
      flex-shrink: 0;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    @media (min-width: 769px) {
      .dpad { display: none; }
    }

    @media (max-width: 768px) {
      h1 { font-size: 1rem; }
      .dpad button { width: 44px; height: 44px; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>JFK QUEUE SIMULATOR</h1>
    <div class="subtitle">Border Control Experience&trade; &mdash; Now with 100% more suffering</div>
  </div>
  <div class="scoreboard">
    <div><span>Queue: </span><span class="value" id="score">0</span></div>
    <div><span>Wasted: </span><span class="minutes" id="minutes">0</span><span class="minutes">min</span></div>
    <div><span>Record: </span><span class="value" id="high-score">0</span></div>
  </div>
  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#2c5f8a"></span> You (the queue)</div>
    <div class="legend-item"><span class="legend-dot" style="background:#c0392b"></span> Lost passports</div>
    <div class="legend-item"><span class="legend-dot" style="background:#27ae60"></span> US citizens (dodge!)</div>
  </div>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>
  <div class="dpad">
    <button id="btn-up" aria-label="Up">&#9650;</button>
    <button id="btn-left" aria-label="Left">&#9664;</button>
    <button id="btn-right" aria-label="Right">&#9654;</button>
    <button id="btn-down" aria-label="Down">&#9660;</button>
  </div>
  <p class="hint">Swipe or D-pad to move &bull; Collect passports &bull; Dodge US citizens &bull; Tap to pause</p>
  <script src="js/main.js"></script>
</body>
</html>
