<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>JFK Immigration Queue Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #2c3e50;
      color: #ecf0f1;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .header { text-align: center; padding: 4px 0 2px; }

    h1 {
      font-size: 1rem;
      color: #e74c3c;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 0.55rem;
      color: #7f8c8d;
      margin-top: 1px;
    }

    .scoreboard {
      display: flex;
      gap: 14px;
      margin: 2px 0;
      font-size: 0.75rem;
    }

    .scoreboard span { color: #95a5a6; }
    .scoreboard .value { color: #e74c3c; font-weight: bold; }
    .scoreboard .frust { color: #f39c12; font-weight: bold; }

    #game-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      width: 100%;
      max-width: 500px;
      padding: 0 4px;
      min-height: 0;
    }

    #game-canvas {
      border: 2px solid #5d4e37;
      border-radius: 4px;
    }

    .controls {
      display: flex;
      gap: 20px;
      margin: 4px 0;
      flex-shrink: 0;
    }

    .controls button {
      width: 70px;
      height: 50px;
      border: 2px solid #5d4e37;
      border-radius: 10px;
      background: #34495e;
      color: #e74c3c;
      font-size: 1.2rem;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .controls button:active {
      background: #5d4e37;
      border-color: #e74c3c;
    }

    .hint {
      margin: 2px 0 4px;
      font-size: 0.6rem;
      color: #5d6d7e;
      text-align: center;
      flex-shrink: 0;
    }

    @media (min-width: 769px) {
      .controls { display: none; }
    }

    @media (max-width: 768px) {
      h1 { font-size: 0.9rem; }
      .controls button { width: 60px; height: 44px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>JFK IMMIGRATION QUEUE</h1>
    <div class="subtitle">U.S. Customs & Border Protection Experience&trade; &mdash; "Your wait is important to us"</div>
  </div>
  <div class="scoreboard">
    <div><span>Wasted: </span><span class="value" id="score">0 min</span></div>
    <div><span>Redirected: </span><span class="value" id="redirects">0</span></div>
    <div><span>Patience: </span><span class="frust" id="frustration">0%</span></div>
  </div>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>
  <div class="controls">
    <button id="btn-left" aria-label="Switch left">&#9664; LANE</button>
    <button id="btn-right" aria-label="Switch right">LANE &#9654;</button>
  </div>
  <p class="hint">Swipe or tap arrows to switch lanes &bull; You move forward automatically &bull; Tap to pause</p>
  <script src="js/main.js"></script>
</body>
</html>
